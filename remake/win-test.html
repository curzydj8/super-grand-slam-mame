<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Win Screen Test</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script src="js/tiles.js"></script>
<script src="js/audio.js"></script>
<script src="js/sdmg2.js"></script>
<script src="js/yaku.js"></script>
<script src="js/game2.js"></script>
<script src="js/ui2.js"></script>
<script>
window.addEventListener('load', function () {
  var game = new SDMG2Game();
  game.credit = 20;
  game.bet = 10;
  // 还原截图：大車輪 14张
  // 1筒2筒3筒4筒5筒6筒7筒8筒 2筒3筒4筒5筒6筒7筒
  game.playerHand = [9,10,11,12,13,14,15,16,17,10,11,12,13,14];
  game.cpuDiscards = [17]; // 9筒
  game.state = 'win';
  game.lastWin = {
    winner: 'player',
    yakuList: [{name:'大車輪', han:13}],
    han: 13, points: 750, yakuman: true, isTsumo: true
  };
  SDMG2UI.init('game', game);
  // 触发win事件显示大字
  game.emit('win', game.lastWin);
});
</script>
</body>
</html>
