<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>Game Test</title>
<link rel="stylesheet" href="css/style.css?v=3"></head>
<body><div id="wrap"><canvas id="game"></canvas></div>
<script src="js/tiles.js?v=3"></script>
<script src="js/audio.js?v=3"></script>
<script src="js/sdmg2.js?v=3"></script>
<script src="js/yaku.js?v=3"></script>
<script src="js/game2.js?v=3"></script>
<script src="js/ui2.js?v=3"></script>
<script>
window.addEventListener('load', function () {
  var game = new SDMG2Game();
  game.credit = 0; game.bet = 10; game.donden = 4;
  game.wall = [];
  for (var i = 0; i < 80; i++) game.wall.push(i % 34);
  // 按截图摆牌：三萬三萬伍萬六萬七萬九萬 筒... 南北發
  game.playerHand = [2,2,4,5,6,8,10,11,12,13,16,28,30,32];
  game.cpuDiscards = [32];
  game.state = 'draw';
  game.lastDraw = -1;
  SDMG2UI.init('game', game);
});
</script></body></html>
